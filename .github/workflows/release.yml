name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}

jobs:
  macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: DupeRemover
    steps:
      - uses: actions/checkout@v4
      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project DupeRemover.xcodeproj -scheme DupeRemover \
            -configuration Release -destination 'generic/platform=macOS' \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Make DMG
        run: |
          mkdir -p build/dmg
          cp -R build/Release/*.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname DupeRemover -srcfolder build/dmg -ov -format UDZO build/DupeRemover.dmg
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: DupeRemover/build/DupeRemover.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: DupeRemover-dmg
          path: DupeRemover/build/DupeRemover.dmg

  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: DupeRemover
    steps:
      - uses: actions/checkout@v4
      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project DupeRemover.xcodeproj -scheme DupeRemover \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -qry DupeRemover-unsigned.ipa Payload
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: DupeRemover/build/DupeRemover-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: DupeRemover-ipa
          path: DupeRemover/build/DupeRemover-unsigned.ipa
